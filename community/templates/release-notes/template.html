<div class="h-full grid grid-cols-[1fr_1.6fr] gap-14 p-16 items-center">
  <div class="flex flex-col gap-5">
    <span class="self-start rounded-full bg-accent text-[#0a0a0c] px-5 py-2 font-mono text-2xl font-bold">{{kicker}}</span>
    <h2 class="font-head text-6xl font-bold leading-none tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="flex flex-col divide-y divide-rule">
    {{#items}}
    <div class="flex items-center gap-5 py-5">
      <span class="w-32 shrink-0 flex items-center gap-2 rounded-lg bg-[color-mix(in_srgb,var(--accent)_16%,transparent)] px-3 py-1.5 text-sm font-semibold uppercase tracking-wider text-accent"><i class="ph {{icon}}"></i>{{title}}</span>
      <span class="text-xl">{{text}}</span>
    </div>
    {{/items}}
  </div>
</div>
