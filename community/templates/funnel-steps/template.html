<div class="h-full grid grid-cols-[1fr_1.5fr] gap-14 p-16 items-center">
  <div class="flex flex-col gap-5">
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold leading-tight tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="flex flex-col items-center gap-3">
    {{#items}}
    <div class="h-20 rounded-2xl bg-accent text-[#0a0a0c] flex items-center justify-between px-8" style="width: calc(112% - {{index}} * 14%); opacity: calc(1.08 - {{index}} * 0.12)">
      <span class="text-xl font-semibold">{{title}}</span>
      <span class="font-head text-3xl font-black">{{text}}</span>
    </div>
    {{/items}}
  </div>
</div>
