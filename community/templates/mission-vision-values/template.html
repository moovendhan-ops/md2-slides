<div class="h-full flex flex-col justify-between gap-10 p-16">
  <div class="grid grid-cols-2 gap-12">
    <div>
      <div class="text-sm font-semibold uppercase tracking-widest text-accent">Mission</div>
      <h2 class="font-head text-4xl font-bold leading-tight tracking-tight mt-3">{{title}}</h2>
    </div>
    {{#body}}<div>
      <div class="text-sm font-semibold uppercase tracking-widest text-accent">Vision</div>
      <p class="text-3xl leading-snug mt-3 text-muted">{{body}}</p>
    </div>{{/body}}
  </div>
  <div class="grid grid-flow-col auto-cols-fr gap-5">
    {{#items}}
    <div class="rounded-2xl bg-panel border border-rule p-6 flex flex-col gap-3">
      <div class="flex items-center justify-between"><i class="ph {{icon}} text-3xl text-accent"></i><span class="font-mono text-muted">0{{index}}</span></div>
      <div class="text-xl font-semibold">{{title}}</div>
      <div class="text-muted leading-snug">{{text}}</div>
    </div>
    {{/items}}
  </div>
</div>
