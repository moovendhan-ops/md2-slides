<div class="h-full flex flex-col gap-12 p-16">
  <div>
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
  </div>
  <div class="flex-1 grid grid-cols-4 gap-8 content-center">
    {{#items}}
    <div class="flex flex-col items-center text-center gap-4">
      <div class="size-36 rounded-full grid place-items-center bg-[color-mix(in_srgb,var(--accent)_18%,transparent)] ring-4 ring-accent ring-offset-4 ring-offset-bg">
        <i class="ph {{icon}} text-6xl text-accent"></i>
      </div>
      <div>
        <div class="text-2xl font-semibold">{{title}}</div>
        <div class="text-muted mt-1">{{text}}</div>
      </div>
    </div>
    {{/items}}
  </div>
</div>
