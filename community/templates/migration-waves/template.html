<div class="h-full flex flex-col gap-10 p-16">
  <div>
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted mt-3 max-w-3xl">{{body}}</p>{{/body}}
  </div>
  <div class="flex-1 grid grid-flow-col auto-cols-fr gap-5 items-end">
    {{#items}}
    <div class="rounded-2xl border border-rule bg-panel p-6 flex flex-col gap-4" style="min-height: calc(30% + {{index}} * 12%)">
      <div class="flex items-center justify-between">
        <span class="font-mono text-sm font-semibold uppercase tracking-widest text-accent">Wave {{index}}</span>
        <i class="ph {{icon}} text-2xl text-accent"></i>
      </div>
      <div class="text-2xl font-semibold">{{title}}</div>
      <div class="text-muted leading-snug">{{text}}</div>
    </div>
    {{/items}}
  </div>
</div>
