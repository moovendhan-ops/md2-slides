<div class="h-full grid grid-cols-[1fr_1.5fr] gap-16 p-16 items-center">
  <div class="flex flex-col gap-5">
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold leading-tight tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="flex flex-col gap-7">
    {{#items}}
    <div>
      <div class="flex justify-between text-xl"><span class="font-semibold">{{title}}</span><span class="font-mono text-accent">{{text}}%</span></div>
      <div class="mt-3 h-4 rounded-full bg-chip overflow-hidden"><div class="h-full rounded-full bg-accent" style="width: {{text}}%"></div></div>
    </div>
    {{/items}}
  </div>
</div>
