<div class="h-full flex flex-col gap-10 p-16">
  <div>
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted mt-3 max-w-3xl">{{body}}</p>{{/body}}
  </div>
  <div class="flex-1 grid grid-cols-3 gap-6">
    {{#items}}
    <div class="rounded-3xl border border-rule p-8 flex flex-col gap-5 first:bg-accent first:text-[#0a0a0c] first:border-transparent [&:nth-child(2)]:bg-panel">
      <div class="flex items-center justify-between"><span class="font-head text-4xl font-black">{{title}}</span><i class="ph {{icon}} text-3xl"></i></div>
      <div class="text-xl leading-relaxed opacity-85">{{text}}</div>
    </div>
    {{/items}}
  </div>
</div>
