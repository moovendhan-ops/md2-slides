<div class="h-full flex flex-col gap-6 p-12">
  <h2 class="font-head text-3xl font-bold tracking-tight">{{title}}</h2>
  <div class="flex-1 min-h-0 rounded-2xl overflow-hidden border border-rule bg-panel flex flex-col">
    <div class="flex items-end gap-1 px-4 pt-3 border-b border-rule">
      <span class="flex gap-2 pb-3 pr-4"><span class="size-3 rounded-full bg-[#ff5f57]"></span><span class="size-3 rounded-full bg-[#febc2e]"></span><span class="size-3 rounded-full bg-[#28c840]"></span></span>
      <span class="rounded-t-lg border border-b-0 border-rule bg-bg px-5 py-2 font-mono text-sm"><i class="ph ph-file-code text-accent mr-2"></i>{{kicker}}</span>
    </div>
    <pre class="flex-1 font-mono text-xl leading-relaxed p-8 whitespace-pre-wrap break-words overflow-hidden">{{code}}</pre>
  </div>
</div>
