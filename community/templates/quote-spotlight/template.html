<div class="h-full flex flex-col justify-center gap-10 px-24 py-16">
  <i class="ph ph-quotes text-8xl text-accent leading-none"></i>
  <blockquote class="font-head text-5xl font-semibold leading-tight tracking-tight max-w-[60rem]">{{title}}</blockquote>
  <div class="flex items-center gap-4">
    <span class="h-px w-16 bg-accent"></span>
    <div class="flex flex-col">
      <span class="text-xl font-medium">{{body}}</span>
      {{#kicker}}<span class="text-sm uppercase tracking-widest text-muted mt-1">{{kicker}}</span>{{/kicker}}
    </div>
  </div>
</div>
