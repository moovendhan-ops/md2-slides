<div class="h-full flex flex-col gap-10 p-16">
  <div>
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted mt-3 max-w-3xl">{{body}}</p>{{/body}}
  </div>
  <div class="flex-1 grid grid-cols-2 gap-5 content-center">
    {{#items}}
    <div data-i="{{icon}}" class="group flex items-start gap-5 rounded-2xl border-2 border-accent p-6 data-[i=ph-x-circle]:border-[#ef4444]">
      <i class="ph {{icon}} text-4xl text-accent group-data-[i=ph-x-circle]:text-[#ef4444] shrink-0"></i>
      <div>
        <div class="text-xl font-semibold">{{title}}</div>
        <div class="text-muted mt-1">{{text}}</div>
      </div>
    </div>
    {{/items}}
  </div>
</div>
