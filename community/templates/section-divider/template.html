<div class="h-full grid grid-cols-[1fr_1.4fr] items-center gap-12 px-20">
  <div class="font-head font-black leading-none text-[18rem] tracking-tighter text-transparent [-webkit-text-stroke:3px_var(--accent)]">{{kicker}}</div>
  <div class="flex flex-col gap-6 border-l-4 border-accent pl-10">
    <h2 class="font-head text-6xl font-bold leading-[1.05] tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted max-w-xl">{{body}}</p>{{/body}}
  </div>
</div>
