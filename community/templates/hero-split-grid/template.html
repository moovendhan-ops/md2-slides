<div class="relative h-full w-full overflow-hidden flex flex-col items-center justify-between p-10 bg-[#07090e] text-white select-none">
  <!-- Background Image or Ambient Glow Backdrop -->
  {{#image}}
  <img src="{{image}}" class="absolute inset-0 h-full w-full object-cover filter brightness-[0.35] contrast-125" alt="" />
  <div class="absolute inset-0 bg-gradient-to-t from-[#07090e] via-[#07090e]/40 to-[#07090e]/90"></div>
  {{/image}}
  {{^image}}
  <div class="absolute inset-0 bg-radial from-slate-900 via-[#07090e] to-[#030407]"></div>
  <div class="absolute -top-24 -left-24 h-96 w-96 rounded-full bg-blue-600/20 blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-10 -right-20 h-96 w-96 rounded-full bg-red-500/15 blur-[120px] pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/3 -translate-y-1/2 h-80 w-80 rounded-full bg-indigo-500/10 blur-[90px] pointer-events-none"></div>
  {{/image}}

  <!-- Header -->
  <div class="relative z-10 flex flex-col items-center text-center pt-2">
    <h1 class="font-head text-4xl sm:text-5xl font-normal tracking-tight text-white drop-shadow-lg">
      {{title}}
    </h1>
    {{#kicker}}
    <span class="mt-2 text-[11px] font-semibold tracking-[0.28em] uppercase text-zinc-400">
      {{kicker}}
    </span>
    {{/kicker}}
  </div>

  <!-- Center Floating Frosted Glass Card -->
  <div class="relative z-10 my-auto w-full max-w-lg rounded-[2rem] border border-white/10 bg-white/[0.04] p-8 sm:p-10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8),inset_0_1px_1px_rgba(255,255,255,0.15)] backdrop-blur-2xl">
    <div class="grid grid-cols-3 gap-x-6 gap-y-9 place-items-center">
      {{#items}}
      <div class="group flex flex-col items-center justify-center gap-3 text-center cursor-pointer transition-all duration-200 hover:-translate-y-1">
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/[0.03] text-3xl text-zinc-200 transition-colors group-hover:bg-white/[0.08] group-hover:text-white">
          <i class="ph {{icon}}"></i>
        </div>
        <span class="text-xs font-medium tracking-wide text-zinc-300 transition-colors group-hover:text-white">
          {{title}}
        </span>
      </div>
      {{/items}}
    </div>
  </div>
</div>
