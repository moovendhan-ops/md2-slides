<div class="h-full grid grid-cols-[1fr_1.5fr] gap-14 p-16 items-center">
  <div class="flex flex-col gap-5">
    {{#kicker}}<div class="font-mono text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold leading-tight tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="relative flex flex-col gap-5 pl-14">
    <div class="absolute left-[1.15rem] top-3 bottom-3 w-1 rounded-full bg-accent"></div>
    {{#items}}
    <div class="relative flex items-center gap-5 rounded-xl border border-rule bg-panel px-5 py-4">
      <span class="absolute -left-[2.85rem] size-6 rounded-full bg-bg border-[5px] border-accent"></span>
      <code class="font-mono text-lg text-accent">{{title}}</code>
      <span class="font-mono text-lg">{{text}}</span>
    </div>
    {{/items}}
  </div>
</div>
