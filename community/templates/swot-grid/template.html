<div class="h-full flex flex-col gap-8 p-14">
  <h2 class="font-head text-4xl font-bold tracking-tight">{{title}}</h2>
  <div class="flex-1 grid grid-cols-2 grid-rows-2 gap-5">
    {{#items}}
    <div class="relative overflow-hidden rounded-3xl border border-rule bg-panel p-8 flex flex-col justify-end gap-2 first:bg-accent first:text-[#0a0a0c] first:border-transparent">
      <span class="absolute -top-6 right-4 font-head font-black text-[10rem] leading-none opacity-15">{{index}}</span>
      <div class="text-2xl font-bold first-letter:text-5xl first-letter:font-black">{{title}}</div>
      <div class="text-lg opacity-80">{{text}}</div>
    </div>
    {{/items}}
  </div>
</div>
