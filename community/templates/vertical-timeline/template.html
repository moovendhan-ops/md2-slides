<div class="h-full grid grid-cols-[1fr_1.4fr] gap-16 p-16">
  <div class="flex flex-col justify-center gap-5">
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-6xl font-bold leading-none tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="relative flex flex-col justify-center gap-7 pl-12">
    <div class="absolute left-3 top-6 bottom-6 w-1 rounded-full bg-rule"></div>
    {{#items}}
    <div class="relative">
      <span class="absolute -left-12 top-1 size-7 rounded-full bg-bg border-[5px] border-accent"></span>
      <div class="font-mono text-sm font-semibold uppercase tracking-widest text-accent">{{title}}</div>
      <div class="text-2xl font-semibold mt-1">{{text}}</div>
    </div>
    {{/items}}
  </div>
</div>
