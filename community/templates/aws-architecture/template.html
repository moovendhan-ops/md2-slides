<div class="h-full flex flex-col gap-6 p-14">
  <div class="flex items-end justify-between">
    <h2 class="font-head text-4xl font-bold tracking-tight">{{title}}</h2>
    {{#kicker}}<span class="font-mono text-sm text-muted">{{kicker}}</span>{{/kicker}}
  </div>
  <div class="relative flex-1 rounded-2xl border-2 border-rule p-6 pt-12">
    <span class="absolute left-5 top-3 flex items-center gap-2 text-sm font-semibold"><i class="ph ph-cloud text-accent text-xl"></i>AWS Cloud</span>
    <div class="relative h-full rounded-xl border-2 border-dashed border-accent p-6 pt-12">
      <span class="absolute left-5 top-3 flex items-center gap-2 text-sm font-semibold text-accent"><i class="ph ph-globe-hemisphere-west text-xl"></i>Region</span>
      <div class="relative h-full rounded-xl border-2 border-[#22c55e] bg-[color-mix(in_srgb,#22c55e_6%,transparent)] p-6 pt-12">
        <span class="absolute left-5 top-3 flex items-center gap-2 text-sm font-semibold text-[#22c55e]"><i class="ph ph-lock-simple text-xl"></i>VPC</span>
        <div class="h-full grid grid-flow-col auto-cols-fr gap-5 items-center">
          {{#items}}
          <div class="flex flex-col items-center text-center gap-3">
            <div class="size-20 rounded-2xl grid place-items-center bg-accent text-[#0a0a0c]"><i class="ph {{icon}} text-4xl"></i></div>
            <div class="text-lg font-semibold">{{title}}</div>
            <div class="text-sm text-muted leading-snug">{{text}}</div>
          </div>
          {{/items}}
        </div>
      </div>
    </div>
  </div>
</div>
