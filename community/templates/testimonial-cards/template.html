<div class="h-full flex flex-col gap-10 p-16">
  <div>
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted mt-3 max-w-3xl">{{body}}</p>{{/body}}
  </div>
  <div class="flex-1 grid grid-flow-col auto-cols-fr gap-6 items-center">
    {{#items}}
    <figure class="rounded-3xl border border-rule bg-panel p-8 flex flex-col gap-6 h-full justify-between even:bg-accent even:text-[#0a0a0c] even:border-transparent">
      <i class="ph ph-quotes text-5xl opacity-60"></i>
      <blockquote class="text-2xl font-medium leading-snug">{{text}}</blockquote>
      <figcaption class="flex items-center gap-4">
        <span class="size-12 rounded-full grid place-items-center border-2 border-current"><i class="ph {{icon}} text-2xl"></i></span>
        <span class="text-lg font-semibold">{{title}}</span>
      </figcaption>
    </figure>
    {{/items}}
  </div>
</div>
