<div class="h-full grid grid-cols-[1fr_1.6fr] gap-14 p-16">
  <div class="flex flex-col justify-center gap-5">
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold leading-tight tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="flex flex-col justify-center">
    {{#items}}
    <div class="flex items-center gap-8 py-5 border-b border-rule last:border-0">
      <span class="w-28 shrink-0 font-mono text-2xl font-bold text-accent">{{title}}</span>
      <span class="text-xl">{{text}}</span>
    </div>
    {{/items}}
  </div>
</div>
