<div class="h-full flex flex-col gap-10 p-16">
  <div>
    {{#kicker}}<div class="font-mono text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
  </div>
  <div class="flex-1 grid grid-cols-2 gap-x-12 gap-y-5 content-center">
    {{#items}}
    <div class="flex items-center justify-between gap-6 border-b border-rule pb-5">
      <span class="text-xl">{{text}}</span>
      <kbd class="shrink-0 rounded-xl border-2 border-rule border-b-[6px] bg-panel px-4 py-2 font-mono text-lg font-semibold">{{title}}</kbd>
    </div>
    {{/items}}
  </div>
</div>
