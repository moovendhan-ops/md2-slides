<div class="h-full grid grid-cols-[1fr_1.4fr] gap-14 p-16 items-center">
  <div class="flex flex-col gap-5">
    {{#kicker}}<div class="font-mono text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold leading-tight tracking-tight">{{title}}</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="rounded-2xl border border-rule bg-panel divide-y divide-rule">
    {{#items}}
    <div class="flex items-center justify-between px-7 py-5">
      <code class="font-mono text-xl">{{title}}</code>
      <span data-v="{{text}}" class="group w-20 h-10 rounded-full p-1 flex bg-rule data-[v=on]:bg-accent data-[v=on]:justify-end">
        <span class="size-8 rounded-full bg-white shadow"></span>
      </span>
    </div>
    {{/items}}
  </div>
</div>
