<div class="h-full flex flex-col gap-8 p-16">
  <div class="flex items-end justify-between gap-10">
    <div>
      {{#kicker}}<div class="font-mono text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
      <h2 class="font-head text-5xl font-bold tracking-tight mt-2">{{title}}</h2>
    </div>
    {{#body}}<p class="text-lg text-muted max-w-md text-right">{{body}}</p>{{/body}}
  </div>
  <div class="flex-1 flex flex-col justify-center gap-3">
    {{#items}}
    <div class="grid grid-cols-[1.1fr_1fr] items-center gap-8 rounded-xl border border-rule bg-panel px-6 py-4">
      <code class="font-mono text-xl"><span class="text-accent select-none">$ </span>{{title}}</code>
      <span class="text-lg text-muted">{{text}}</span>
    </div>
    {{/items}}
  </div>
</div>
