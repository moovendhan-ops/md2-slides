<div class="h-full grid grid-cols-[1fr_1.2fr] gap-14 p-16 items-center">
  <div class="flex flex-col gap-5">
    {{#kicker}}<div class="text-sm font-semibold uppercase tracking-widest text-accent">{{kicker}}</div>{{/kicker}}
    <h2 class="font-head text-5xl font-bold leading-tight tracking-tight">Schema</h2>
    {{#body}}<p class="text-xl text-muted">{{body}}</p>{{/body}}
  </div>
  <div class="rounded-2xl border-2 border-accent overflow-hidden">
    <div class="flex items-center gap-3 bg-accent text-[#0a0a0c] px-6 py-4 font-mono text-2xl font-bold"><i class="ph ph-table"></i>{{title}}</div>
    {{#items}}
    <div class="group flex items-center justify-between px-6 py-3 border-b border-rule last:border-0 font-mono text-lg [&:nth-child(2)]:font-bold">
      <span class="flex items-center gap-3"><i class="ph ph-key text-accent opacity-0 group-[:nth-child(2)]:opacity-100"></i>{{title}}</span>
      <span class="text-muted">{{text}}</span>
    </div>
    {{/items}}
  </div>
</div>
