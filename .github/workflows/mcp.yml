name: MCP server

# PRs: build and test the md2slides-mcp package. Tags `mcp-v*`: publish it to npm.
on:
  pull_request:
    paths: ["packages/mcp/**", "src/engine/**", "src/domain/share/**", "public/llms-full.txt", "src/data/**"]
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx vitest run packages/mcp
      # The server bundles the standalone player (public/player/, gitignored).
      - run: npm run player:build
      - run: npm run mcp:build
      - name: Smoke test (server starts)
        run: echo "" | timeout 10 node packages/mcp/dist/index.js
      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          v=$(node -p "require('./packages/mcp/package.json').version")
          [ "mcp-v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/mcp-v') && env.NPM_TOKEN != ''
        working-directory: packages/mcp
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
